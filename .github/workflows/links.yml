# Every link in the docs still answers: on each pull request, on main, and
# weekly (a page elsewhere can move without a commit here).
name: Links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --scheme https
            --scheme http
            --max-concurrency 8
            --accept 200,206,429
            --exclude-path mcp/tools.md
            --exclude '^https://(www\.)?(x|linkedin|instagram|facebook|pinterest)\.com'
            --exclude '^https://pagetovid\.com/(new|account|projects)'
            './**/*.md'
          fail: true
