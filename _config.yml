title: PageToVid Docs
description: >-
  Turn any website into a narrated, captioned video — from the web app, the REST API,
  or your AI assistant over MCP. Guides, the full MCP tool reference and best practices.
url: https://pagetovid.github.io
baseurl: /docs
lang: en

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

color_scheme: dark
search_enabled: true
search:
  heading_level: 3
  previews: 3
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Open PageToVid": https://pagetovid.com
  "GitHub": https://github.com/PageToVid
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: https://github.com/PageToVid/docs
gh_edit_branch: main
gh_edit_view_mode: edit

footer_content: >-
  © PageToVid · <a href="https://pagetovid.com">pagetovid.com</a> ·
  <a href="https://pagetovid.com/terms">Terms</a> · <a href="https://pagetovid.com/privacy">Privacy</a>

callouts:
  tip:
    title: Tip
    color: green
  warning:
    title: Watch out
    color: yellow
  note:
    title: Note
    color: blue

exclude:
  - README.md
  - scripts/
  - Gemfile
  - Gemfile.lock
